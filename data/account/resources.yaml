rmb:
  name: "人民币"
  unit: "元"
  token_rate: 60  # 1元 = 60 token（按时间机会成本）

time:
  name: "时间"
  unit: "分钟"
  token_rate: 1   # 1分钟 = 1 token（基准）

token:
  name: "Token"
  unit: "token"
  token_rate: 1   # 1 token = 1 token

artifact.draft:
  name: "手稿"
  unit: "篇"
  token_rate: dynamic  # 按消耗时间计算

artifact.code:
  name: "代码"
  unit: "份"
  token_rate: dynamic

artifact.document:
  name: "文档"
  unit: "份"
  token_rate: dynamic

artifact.sheet:
  name: "表格"
  unit: "份"
  token_rate: dynamic
