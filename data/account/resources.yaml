rmb:
  name: "人民币"
  unit: "元"
  token_rate: 60  # 1元 = 60 token（按时间机会成本）

time:
  name: "时间"
  unit: "分钟"
  token_rate: 1   # 1分钟 = 1 token（基准）

token:
  name: "Token"
  unit: "token"
  token_rate: 1   # 1 token = 1 token

